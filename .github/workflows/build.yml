name: build

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run useless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The oldest JDK the README promises
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # The integration tests open real windows: a virtual display, and Mesa's llvmpipe to draw
      # in software (OpenGL 4.5 core, so the 3.3 core profile of the application is available)
      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Unit and integration tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' ./gradlew check

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/'

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          # The unit tests of every module and the integration tests of the application
          files: core/build/reports/jacoco/test/jacocoTestReport.xml,ephemeris/build/reports/jacoco/test/jacocoTestReport.xml,app/build/reports/jacoco/test/jacocoTestReport.xml,app/build/reports/jacoco/jacocoIntegrationTestReport/jacocoIntegrationTestReport.xml

  # On macOS GLFW wants the first thread of the process, and the integration tests have never been
  # set up for it: they run on Linux only, and on macOS the packaged application is started instead
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and the package of the application
        run: ./gradlew test :app:jpackageArchive

      # Unpacked as a user would, so that the archive is checked too; still running after half a
      # minute means it opened its window and draws
      - name: The packaged application starts
        run: |
          mkdir unpacked
          tar -xzf app/build/distributions/AstronomicalSystem-*-macos-arm64.tar.gz -C unpacked
          unpacked/AstronomicalSystem.app/Contents/MacOS/AstronomicalSystem > run.log 2>&1 &
          application=$!
          sleep 30
          cat run.log
          kill -0 "$application"
          kill "$application"
