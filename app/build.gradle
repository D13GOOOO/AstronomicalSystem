plugins {
    id 'astronomicalsystem.java-conventions'
    id 'application'
}

def lwjglVersion = '3.4.3'
// stb_truetype draws the text of the head-up display
def lwjglModules = ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-stb']
// Windows, Linux, and macOS on Intel and Apple silicon
def lwjglNatives = ['natives-windows', 'natives-linux', 'natives-macos', 'natives-macos-arm64']

dependencies {
    implementation project(':ephemeris')

    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    lwjglModules.each { module ->
        implementation "org.lwjgl:$module"
        lwjglNatives.each { natives -> runtimeOnly "org.lwjgl:$module::$natives" }
    }
}

// LWJGL loads its native libraries through JNI, a restricted operation since JDK 24
def nativeAccess = '--enable-native-access=ALL-UNNAMED'

application {
    mainClass = 'astronomicalsystem.app.Main'
    applicationDefaultJvmArgs = [nativeAccess]
}

// Tests that need a display and a graphics card: they open real windows
testing {
    suites {
        integrationTest(JvmTestSuite) {
            useJUnitJupiter('5.11.4')
            dependencies {
                implementation project()
                // The views take vectors of the domain
                implementation project(':core')
                implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
                implementation 'org.lwjgl:lwjgl-glfw'
                implementation 'org.lwjgl:lwjgl-opengl'
                implementation 'org.assertj:assertj-core:3.27.7'
            }
            targets.configureEach {
                testTask.configure {
                    jvmArgs nativeAccess
                    shouldRunAfter tasks.named('test')
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.integrationTest
}

// The OpenGL adapters are exercised only by the integration tests: their coverage is reported apart
def integrationTestCoverage = tasks.register('jacocoIntegrationTestReport', JacocoReport) {
    executionData tasks.named('integrationTest').get()
    sourceSets sourceSets.main
    reports {
        xml.required = true
    }
}

tasks.named('integrationTest') {
    finalizedBy integrationTestCoverage
}

// A self-contained application for the platform of the build: jpackage puts a Java runtime next to
// the jars, so that nothing needs to be installed. It accepts only numeric versions (2.1.1)
def packageVersion = version.toString().replaceFirst(/-.*/, '')
def packageInput = layout.buildDirectory.dir('install/app/lib')
def packageOutput = layout.buildDirectory.dir('jpackage')

tasks.register('jpackage', Exec) {
    group = 'distribution'
    description = 'Builds an application image with its own Java runtime for this platform.'
    dependsOn tasks.named('installDist')
    inputs.dir packageInput
    outputs.dir packageOutput
    // jpackage refuses to write over an image it made before
    doFirst {
        delete packageOutput
    }
    executable = file("${System.getProperty('java.home')}/bin/jpackage")
    args '--type', 'app-image',
            '--name', 'AstronomicalSystem',
            '--app-version', packageVersion,
            '--input', packageInput.get().asFile,
            '--main-jar', tasks.named('jar').get().archiveFileName.get(),
            '--main-class', application.mainClass.get(),
            '--java-options', nativeAccess,
            '--dest', packageOutput.get().asFile
}

// The image in one archive for the release page, named after the version and the platform: a zip
// on Windows, elsewhere a gzipped tar, which keeps the launcher executable
def osName = System.getProperty('os.name').toLowerCase()
def system = osName.startsWith('windows') ? 'windows' : osName.startsWith('mac') ? 'macos' : 'linux'
def processor = [amd64: 'x64', x86_64: 'x64', aarch64: 'arm64'].get(System.getProperty('os.arch'), System.getProperty('os.arch'))
def onWindows = system == 'windows'

tasks.register('jpackageArchive', onWindows ? Zip : Tar) { archive ->
    group = 'distribution'
    description = 'Packs the application image into one archive for the release page.'
    from tasks.named('jpackage')
    destinationDirectory = layout.buildDirectory.dir('distributions')
    archiveFileName = "AstronomicalSystem-${version}-${system}-${processor}.${onWindows ? 'zip' : 'tar.gz'}"
    // Gradle would make every file 644 for reproducible archives: the launcher must stay executable
    useFileSystemPermissions()
    if (archive instanceof Tar) {
        archive.compression = Compression.GZIP
    }
}
